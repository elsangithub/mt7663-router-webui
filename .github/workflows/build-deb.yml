name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER=$(grep "^Version:" debian/control | awk '{print $2}')
          fi
          echo "VERSION=${VER}" >> $GITHUB_OUTPUT

      - name: Build Debian Package
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh ${{ steps.get_version.outputs.VERSION }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt7663-router-webui_${{ steps.get_version.outputs.VERSION }}_all.deb
          path: mt7663-router-webui_*.deb

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mt7663-router-webui_*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
