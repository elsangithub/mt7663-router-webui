# Prevent ARP flux and asymmetric drop when both eth0 and wlan0 are on the same subnet
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
net.ipv4.ip_forward = 1

# Multi-Core Packet Steering (RPS) flow table entries
net.core.rps_sock_flow_entries = 32768

# Google TCP BBR Congestion Control & FQ Queuing for low latency under high load
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Conntrack Fast-Reap: Accelerate dead connection reaping to keep table clean
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
